plugins {
    // Applied so that the spring-boot-dependencies BOM is imported and the
    // unversioned Spring/Kafka/PostgreSQL/Lombok dependencies below resolve.
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

// This module has no @SpringBootApplication class yet, so bootJar cannot resolve
// a main class. Keep packaging disabled until the server's main class is added,
// then remove this block.
tasks.named('bootJar') {
    enabled = false
}

dependencies {
    implementation project(':chronos-proto')
    
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    
    // Database & gRPC Server
    implementation 'org.postgresql:postgresql'
    implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'

    // Boilerplate
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}